version: 2

models:
  - name: stg_products
    description: >
      Batch mới nhất của dữ liệu sản phẩm, đã dedup theo product_id.

    columns:
      - name: product_id
        tests:
          - not_null
          - unique

      - name: price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: seller_id
        tests:
          - not_null

      - name: snapshot_date
        tests:
          - not_null

  - name: stg_products_history
    description: >
      Full lịch sử snapshot_date, grain = (product_id, snapshot_date).

    columns:
      - name: product_id
        tests:
          - not_null

      - name: snapshot_date
        tests:
          - not_null

      - name: price
        tests:
          - not_null

  - name: stg_sellers
    description: >
      Danh sách seller đã dedup theo seller_id từ lịch sử.

    columns:
      - name: seller_id
        tests:
          - not_null
          - unique

      - name: seller_name
