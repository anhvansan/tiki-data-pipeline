version: "3.8"

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: tiki-minio
    ports:
      - "9000:9000" # API endpoint (boto3/s3fs dùng port này)
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_network

networks:
  data_network:
    external: true # đã tạo bằng: docker network create data_network

volumes:
  minio_data:
